<!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

     <title>Xenoblade Characters</title>

     <link rel="stylesheet" href="Style.css"/>
 </head>

 <body>
        <header>
            <h1>Xenoblade 2 character Portraits</h1>
            <p>Search a Xenoblade Chronicles 2 character and see their portrait</p>
        </header>

        <main>
            <div class="search-container">
                <input
                    type="text"
                    id="search-box"
                    placeholder="(Rex for example)"
                    >
                <button id="search-button">Search</button>
            </div>
            <div id="characters" class="character-container">
                <h2>Search for a character!</h2>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
    </html>
